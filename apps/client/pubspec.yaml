name: voicemate
description: 음량 확인과 한국어 발음 훈련을 제공하는 VoiceMate 앱.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  record: 7.1.2
  just_audio: 0.10.6
  path_provider: 2.1.5
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
  assets:
    - assets/prosody/guides/
    - assets/fonts/OFL.txt
    - web/prosody/vendor/supertonic/LICENSE-model.txt
    - android/app/src/main/cpp/vendor/rnnoise/COPYING
    - android/app/src/main/cpp/vendor/libfvad/LICENSE
    - android/app/src/main/cpp/vendor/libfvad/PATENTS
    - android/app/src/main/cpp/vendor/libfvad/AUTHORS
