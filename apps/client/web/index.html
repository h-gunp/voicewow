<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafaf7">
  <meta name="description" content="상황별 음량 확인과 단어·문장 발음 훈련을 제공하는 VoiceMate.">
  <title>VoiceMate · 음량과 발음 훈련</title>
  <style>body{margin:0;background:#fafaf7;color:#252a27;font-family:system-ui,sans-serif}#loading{max-width:720px;margin:36px auto;padding:20px;font-size:14px}</style>
</head>
<body>
  <p id="loading" role="status">VoiceMate를 준비하고 있다.</p>
  <script type="module">
    try {
      await import('./audio/capture-bridge.mjs');
      await import('./pronunciation/bridge.mjs');
      await import('./prosody/bridge.mjs');
      const bootstrap=document.createElement('script');
      bootstrap.src='flutter_bootstrap.js';
      document.body.append(bootstrap);
    } catch {
      document.getElementById('loading').textContent='화면을 불러오지 못했다. 새로고침한다.';
    }
  </script>
</body>
</html>
